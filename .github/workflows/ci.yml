name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar o projeto
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Testar
        run: python -m pytest -q

      - name: Verificar Python
        run: ruff check sao_francisco tests scripts/smoke_installed_package.py

      - name: Verificar tipos
        run: mypy --explicit-package-bases sao_francisco

      - name: Verificar QML
        run: |
          pyside6-qmllint -I sao_francisco/qml \
            sao_francisco/qml/Main.qml \
            sao_francisco/qml/Theme.qml \
            sao_francisco/qml/components/*.qml \
            sao_francisco/qml/pages/*.qml

      - name: Construir artefatos
        run: python -m build

      - name: Verificar o wheel instalado
        run: |
          wheel_target="${RUNNER_TEMP}/sao-francisco-wheel"
          python -m pip install --no-deps --target "${wheel_target}" dist/*.whl
          cd "${RUNNER_TEMP}"
          PYTHONPATH="${wheel_target}" \
            python "${GITHUB_WORKSPACE}/scripts/smoke_installed_package.py"
          tar -tzf "${GITHUB_WORKSPACE}"/dist/*.tar.gz \
            | grep -E '^sao_francisco-[^/]+/THIRD_PARTY_NOTICES\.md$'
